<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELA - Math Exploration & Learning Adventure</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-image: url("mela.png.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.explore-btn {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 45px;
    font-size: 24px;
    font-weight: bold;
    color: white;
    background: #ff9800;
    border: 3px solid white;
    border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c66900;
}

.explore-btn:hover {
    background: #ffc107;
    transform: translateX(-50%) scale(1.08);
}
   </style>

   <style>
    #musicBtn {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 9999;
    background: orange;
    color: white;
    padding: 10px 18px;
    border: 2px solid white;
    border-radius: 25px;
    font-size: 15px;
    cursor: pointer;
}
   </style>
   </head>

<body>

    <button class="explore-btn" onclick="exploreGame()">
        EXPLORE
    </button>

    <script>
        function exploreGame() {
            window.location.href = "game.html";
        }
    </script>

</body>
</html>

<button id="musicBtn" onclick="toggleMusic()">
    🎵 Music OFF
</button>

<audio id="bgMusic" loop>
    <source src="Welcoming intro.mp4" type="audio/mpeg">
</audio>

<script>
    const music = document.getElementById("bgMusic");
    const musicBtn = document.getElementById("musicBtn");

    async function toggleMusic() {
        if (music.paused) {
            try {
                await music.play();
                musicBtn.textContent = "🎵 Music ON";
            } catch (error) {
                alert("Check your music.mp3 file.");
            }
        } else {
            music.pause();
            musicBtn.textContent = "🎵 Music OFF";
        }
    }
</script>

</body>
</html>
