<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELA Math Games</title>

    <style>
 * {
            box-sizing: border-box;
        }

           body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-image: url("meth.png.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: #29245c;
}
        .section-title {
            text-align: center;
            color: #174ea6;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .section-description {
            text-align: center;
            color: #555;
            margin-bottom: 35px;
        }

        /* Four boxes in one row */
        .game-container {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
            
          /* Mela Peak */
        .game-box:nth-child(1) {
    background-image: url("Mela Adventure.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
            border-radius: 18px;
            padding: 25px 18px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            border-bottom: 6px solid #3984e8;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-box {
    display: flex;
    flex-direction: column;
    min-height: 250px; 
    padding: 20px;
}

.play-button {
    margin-top: auto;
    align-self: center;
}  

     /* Mela Maket */
        .game-box:nth-child(2) {
    background-image: url("Mela Market.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
            border-radius: 18px;
            padding: 25px 18px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            border-bottom: 6px solid #3984e8;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-box {
    display: flex;
    flex-direction: column;
    min-height: 250px; 
    padding: 20px;
}

.play-button {
    margin-top: auto;
    align-self: center;
}  

 /* Mela Pizza */
        .game-box:nth-child(3) {
    background-image: url("Mela Pizza.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
            border-radius: 18px;
            padding: 25px 18px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            border-bottom: 6px solid #3984e8;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-box {
    display: flex;
    flex-direction: column;
    min-height: 250px; 
    padding: 20px;
}

/* Mela Pattern Trail */
        .game-box:nth-child(4) {
    background-image: url("Mela Pattern.jpg.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
            border-radius: 18px;
            padding: 25px 18px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.10);
            border-bottom: 6px solid #3984e8;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .game-box {
    display: flex;
    flex-direction: column;
    min-height: 250px; 
    padding: 20px;
}

        .play-button {
            display: inline-block;
            background: #ffc107;
            color: white;
            text-decoration: none;
            padding: 11px 22px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.3s;
        }

        .play-button:hover {
            background: #174ea6;
        }

        /* Tablet */
        @media (max-width: 1000px) {
            .game-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        /* Mobile */
        @media (max-width: 550px) {
            .game-container {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <h1 class="section-title">MELA Math Adventures</h1>
    <p class="section-description">
        Choose your game and start your learning adventure!
    </p>

    <div class="game-container">

        <!-- BOX 1 -->
    <div class="game-box">
          <a href="peak.html" class="play-button">Play Now</a>
      </div>

        <!-- BOX 2 -->
      <div class="game-box">
            <a href="market.html" class="play-button">Play Now</a>
        </div>

        <!-- BOX 3 -->
        <div class="game-box">
            <a href="pizza.html" class="play-button">Play Now</a>
        </div>

        <!-- BOX 4 -->
        <div class="game-box">
            <a href="pattern.html" class="play-button">Play Now</a>
        </div>

    </div>

</body>
</html>
